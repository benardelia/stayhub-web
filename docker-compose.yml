# Production: the static site behind the shared nginx-proxy (same pattern as stayhub-api).
#   VITE_API_URL=https://stayhubapi.akiliunde.com DOMAIN_NAME=estantly.akiliunde.com docker compose up -d --build
# Add the site's origin (https://$DOMAIN_NAME) to CORS_ORIGINS in the API's .env.
services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL to the API origin}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: ${DOMAIN_NAME:?set DOMAIN_NAME}
      LETSENCRYPT_HOST: ${DOMAIN_NAME}
      VIRTUAL_PORT: "80"
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
    name: global-proxy-network
